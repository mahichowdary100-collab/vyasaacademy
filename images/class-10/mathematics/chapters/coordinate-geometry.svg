    <text x="104" y="132" font-size="13" fill="#b45309">(x</text>
    <text x="126" y="130" font-size="10" fill="#b45309">1</text>
    <text x="134" y="132" font-size="13" fill="#b45309">,y</text>
    <text x="150" y="130" font-size="10" fill="#b45309">1</text>
    <text x="158" y="132" font-size="13" fill="#b45309">)</text>
    <text x="316" y="50" font-size="15" fill="#1a237e">B</text>
    <text x="332" y="50" font-size="13" fill="#1a237e">(x</text>
